<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Campeonato Dormitorios</title>
  <meta name="theme-color" content="#0e3b2c">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    .app{padding-block:0 110px}
    .dtitle{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1;margin:10px 0 4px;letter-spacing:.01em;text-wrap:balance}
    .dsub{margin:0;font-size:13px;opacity:.8}
    .fechas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
    .fecha{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
    .fecha b{font-family:var(--f-display);font-size:20px}
    .fecha small{font-size:11px;opacity:.75}
    .fecha.done{background:rgba(255,255,255,.18)}
    .fecha.next{border-color:#e0b84a;box-shadow:inset 0 0 0 1px #e0b84a}
    .lead{margin:14px 0 0;font-size:15px}
    .rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
    .rrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
    .rrow.podio{border-color:var(--gold)}
    .rrow.nocard{opacity:.7}
    .rpos{font-family:var(--f-display);font-weight:700;font-size:26px;text-align:center}
    .rrow.podio .rpos{color:var(--gold)}
    .rmain{min-width:0}
    .rname{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .rsub{font-size:12px;color:var(--muted)}
    .cards{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
    .card{display:flex;flex-direction:column;align-items:center;min-width:44px;padding:2px 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
    .card small{font-size:10px;color:var(--muted)}
    .card b{font-family:var(--f-display);font-size:16px;font-weight:600}
    .card.best{background:var(--fairway);border-color:transparent;color:var(--fairway-ink)}
    .card.best small{color:var(--fairway-ink);opacity:.8}
    .card.none b{color:var(--muted)}
    .rbest{font-family:var(--f-display);font-weight:700;font-size:30px}
    table.edit input{width:54px}
    table.edit input.pname{width:130px;text-align:left}
    table.edit input.flabel{width:58px;font-weight:600}
    table.edit input:disabled{opacity:.35}
    .banner a{color:var(--muted)}
    .card.prov{border-style:dashed}
    .dtabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0 -16px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
    .dtabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 4px;font-weight:600;font-size:13px;color:var(--muted)}
    .dtabs button[aria-selected="true"]{background:var(--fairway);color:var(--fairway-ink);border-color:transparent}
    .fpick{display:flex;gap:6px;margin:8px 0}
    .fpick button{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px;font-weight:600}
    .fpick button[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:var(--surface)}
    .mysum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
    .mysum span{display:flex;flex-direction:column;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 2px}
    .mysum small{font-size:11px;color:var(--muted)}
    .mysum b{font-family:var(--f-display);font-size:22px}
    table.lb td.big{font-family:var(--f-display);font-weight:700;font-size:18px}
    table.lb td.under{color:var(--teamB)}
    table.lb small{color:var(--muted)}
  </style>
</head>
<body>
  <main class="app" id="app"></main>
  <div class="bottom" id="bottom" style="border-top:0;background:transparent"></div>
  <script type="module" src="dormitorios.js"></script>
</body>
</html>
